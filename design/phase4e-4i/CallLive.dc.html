<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On a call with Maya</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/qelvora/tokens.css">
<link rel="stylesheet" href="ds/qelvora/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div data-theme="night" class="qv" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: 20px 16px 32px; gap: 16px">
<x-import component-from-global-scope="Qelvora.CallChip" time="06:18" end="10:00"></x-import>
<div style="flex-grow: 1; border-radius: var(--radius-xl); background: var(--maya-surface); display: flex; align-items: flex-end; justify-content: space-between; padding: 16px; position: relative">
<span style="font-family: var(--font-mono); font-size: 11px; color: var(--on-maya-muted)">VIDEO · MAYA</span>
<div style="width: 96px; height: 128px; border-radius: var(--radius-md); background: var(--surface-sunken); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted)">YOU</span></div>

</div>
</x-dc>
