<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI voice notes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/qelvora/tokens.css">
<link rel="stylesheet" href="ds/qelvora/components/bundle.css">
<script src="ds/qelvora/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="qv" style="width: 390px; height: 1000px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
<x-import component-from-global-scope="Qelvora.ThreadHeader"></x-import>
<x-import component-from-global-scope="Qelvora.IdentityStrip" state="ai"></x-import>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
<x-import component-from-global-scope="Qelvora.Message" kind="fan">Can you say that out loud? I'm at the wheel.</x-import>
<x-import component-from-global-scope="Qelvora.VoiceNote" kind="ai" time="14:40" duration="0:18" transcript="This is Maya's AI. One dip, count to three, let it drip off, sponge the rim."></x-import>
<x-import component-from-global-scope="Qelvora.SystemLine" variant="date">For comparison: Maya's own recording</x-import>
<x-import component-from-global-scope="Qelvora.VoiceNote" time="OCT 5" duration="0:42" transcript="Hi, it's Maya. I looked at your test tile."></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
