<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio · Threads</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/qelvora/tokens.css">
<link rel="stylesheet" href="ds/qelvora/components/bundle.css">
<script src="ds/qelvora/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="qv" style="width: 390px; height: 1000px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: var(--font-serif); font-weight: 400; font-size: 34px; line-height: 36px; letter-spacing: -0.02em">Threads</h1>
<x-import component-from-global-scope="Qelvora.Segmented" items="{{f}}" active="Flagged" label="Filter threads"></x-import>
<p style="margin: 0; font-size: 12px; line-height: 17px; color: var(--ink-muted)">Opening a thread is logged and visible to the fan.</p>
</div>
<div style="padding: 8px 16px 0; flex-grow: 1">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<a href="ThreadView.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none">
<span style="font-weight: 600">{{r.h}}</span><span class="qv-meta">{{r.t}}</span>
<span style="font-size: 13px; color: var(--ink-muted)">{{r.state}}</span><span class="qv-badge" style="color: var(--ink-muted)">{{r.flag}}</span>
</a>
</sc-for>
</div>
<x-import component-from-global-scope="Qelvora.StudioTabBar" active="Threads" requests="{{five}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() { return { five: 5, f: ['All', 'Flagged', 'With requests'], rows: [
{ h: '@kilnfire', t: '14:36', state: "Maya's AI · handoff suggested", flag: 'Request' },
{ h: '@quietclay', t: '13:02', state: "Maya's AI · guardrail: medical question", flag: 'Guardrail' },
{ h: '@wheelhouse', t: 'YESTERDAY', state: "Maya's AI · fan reported a reply", flag: 'Report' },
{ h: '@potterypete', t: 'MON', state: 'You took over · handed back', flag: 'Reviewed' }
] }; }
}
</script>
</body>
</html>
