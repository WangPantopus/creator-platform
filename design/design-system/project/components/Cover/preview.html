<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qelvora</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .plate { fill:var(--maya-surface); rx:var(--radius-xl); }
  [data-theme="night"] .plate { fill:var(--maya-line); }
  .ai { fill:var(--ai-ink); rx:var(--radius-lg); }
  .tint { fill:var(--ai-line); rx:var(--radius-lg); }
  .seal { fill:var(--maya-accent); }
  .ring { fill:none; stroke:var(--ground); stroke-width:1.5; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-style:italic; font-weight:400; font-size:112px; line-height:.92; letter-spacing:-0.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      maya-surface 184×260 slab bled off the top (her plate, the figure people know the product by; maya-line at night so it holds on the ground) · ai-ink 160×160 (the AI's color) · maya-accent disc r40 on the plate (her seal) · ai-line 96×112 bled off the right (relief) · about 30% of 960×288
  arrangement one tall plate with satellites, bottoms on one line space-12 above the edge, space-4 gutters, the AI block lower than the plate
  pattern     a literal motif, from "the seal is the one ornament" and the ring-versus-seal marks: sixteen rings cut from the ai-ink block in ground at a space-8 pitch, the last one filled as a maya-accent seal, which is Maya stepping in
  scales      sides in space-2 multiples; gutters space-4; pitch space-8; plate radius-xl, blocks radius-lg, rings and seals radius-pill (half their side)
-->
<rect class="plate" x="24" y="-20" width="184" height="260" rx="20"/>
<circle class="seal" cx="116" cy="172" r="40"/>
<rect class="ai" x="224" y="80" width="160" height="160" rx="14"/>
<rect class="tint" x="400" y="128" width="96" height="112" rx="14"/>
<circle class="ring" cx="256" cy="112" r="7"/>
<circle class="ring" cx="288" cy="112" r="7"/>
<circle class="ring" cx="320" cy="112" r="7"/>
<circle class="ring" cx="352" cy="112" r="7"/>
<circle class="ring" cx="256" cy="144" r="7"/>
<circle class="ring" cx="288" cy="144" r="7"/>
<circle class="ring" cx="320" cy="144" r="7"/>
<circle class="ring" cx="352" cy="144" r="7"/>
<circle class="ring" cx="256" cy="176" r="7"/>
<circle class="ring" cx="288" cy="176" r="7"/>
<circle class="ring" cx="320" cy="176" r="7"/>
<circle class="ring" cx="352" cy="176" r="7"/>
<circle class="ring" cx="256" cy="208" r="7"/>
<circle class="ring" cx="288" cy="208" r="7"/>
<circle class="ring" cx="320" cy="208" r="7"/>
<circle class="seal" cx="352" cy="208" r="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Qelvora</h1>
<p class="tag">Someone always answers. Only the creator signs.</p>
</div>
</div>
</body>
</html>
