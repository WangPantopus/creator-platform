<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prototype: step in to a signed reply</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/qelvora/tokens.css">
<link rel="stylesheet" href="ds/qelvora/components/bundle.css">
<script src="ds/qelvora/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="qv" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line)"><span class="qv-meta">PROTOTYPE 5.2 · STEP {{stepNo}} OF 5</span><button class="qv-link-btn" onClick="{{restart}}">Restart</button></div>
<sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<x-import component-from-global-scope="Qelvora.IdentityStrip" state="ai"></x-import>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<x-import component-from-global-scope="Qelvora.Message" kind="fan">Could Maya look at my test tile herself?</x-import>
<x-import component-from-global-scope="Qelvora.Message" kind="ai" actions="{{no}}">This is one Maya would want to see herself.</x-import>
</div>
<div style="padding: 16px"><button class="qv-stepin qv-on-maya" onClick="{{next}}"><span class="qv-seal" style="width: 30px; height: 30px; font-size: 19px">M</span>Ask Maya to step in</button></div>
</div>
</sc-if>
<sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<h1 style="margin: 0; font-family: var(--font-serif); font-weight: 400; font-size: 30px; line-height: 32px">What Maya will see</h1>
<x-import component-from-global-scope="Qelvora.EtaLine" ahead="{{four}}"></x-import>
<x-import component-from-global-scope="Qelvora.TermsBlock"></x-import>
<button class="qv-btn qv-btn--maya qv-btn--lg qv-btn--block qv-on-maya" style="margin-top: auto" onClick="{{next}}"><span class="qv-seal" style="width: 28px; height: 28px; font-size: 17px">M</span>Send request · $25 if accepted</button>
</div>
</sc-if>
<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px"><x-import component-from-global-scope="Qelvora.RequestStatus" steps="{{waiting}}"></x-import></div>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted)">A day later…</p>
<button class="qv-btn qv-btn--secondary qv-btn--block" style="margin-top: auto" onClick="{{next}}">Maya accepted · open the reply</button>
</div>
</sc-if>
<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<x-import component-from-global-scope="Qelvora.IdentityStrip" state="human"></x-import>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<x-import component-from-global-scope="Qelvora.SystemLine" variant="presence" time="09:15"></x-import>
<x-import component-from-global-scope="Qelvora.Message" kind="human_creator" live="{{yes}}" time="09:15">That crawl is the rim, not the recipe. Single dip, count to three, then sponge the top.</x-import>
</div>
<div style="padding: 16px"><button class="qv-btn qv-btn--secondary qv-btn--block" onClick="{{next}}">Share this reply</button></div>
</div>
</sc-if>
<sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<x-import component-from-global-scope="Qelvora.ShareCard" handle="@kilnfire" time="OCT 5">That crawl is the rim, not the recipe.</x-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = (this.state && this.state.s) || 0;
return { yes: true, no: false, four: 4, stepNo: s + 1, s0: s === 0, s1: s === 1, s2: s === 2, s3: s === 3, s4: s === 4,
waiting: [{ label: 'Sent · hold placed', time: 'OCT 3 14:02', state: 'done' }, { label: 'Maya decides · usually 1 to 2 days', state: 'current' }, { label: 'Delivered', state: 'todo' }],
next: () => this.setState({ s: Math.min(s + 1, 4) }), restart: () => this.setState({ s: 0 }) };
}
}
</script>
</body>
</html>
