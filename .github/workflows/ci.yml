name: Foundation checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: creator_foundation
          POSTGRES_PASSWORD: foundation-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CREATOR_TEST_DATABASE_URL: postgresql://postgres:foundation-test-only@127.0.0.1:5432/creator_foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  web-visual:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            playwright-report
            test-results
  ios-foundation:
    # Native font rasterization must match the verified macOS26/Intel baseline.
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/artifacts/ios/snapshot-diffs
    steps:
      - uses: actions/checkout@v4
      - name: Record the native capture environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          phone = next(d for runtime, entries in devices.items() if ".iOS-" in runtime for d in entries if d["name"].startswith("iPhone"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("id=" + phone["udid"] + "\n")
          '
      - run: xcodebuild test -project apps/ios/QelvoraApp.xcodeproj -scheme QelvoraApp -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -resultBundlePath artifacts/ios/FoundationFlow.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Check native package and exact snapshots
        if: ${{ !cancelled() }}
        run: swift test --package-path apps/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-review
          path: artifacts/ios
  android-foundation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-review
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/apk/debug/*.apk
  android-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-review
          path: apps/android/app/build/reports/androidTests
