name: Foundation checks
on:
  push:
  pull_request:
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: creator_foundation
          POSTGRES_PASSWORD: foundation-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CREATOR_TEST_DATABASE_URL: postgresql://postgres:foundation-test-only@127.0.0.1:5432/creator_foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  web-visual:
    # Match the macOS26/Intel environment used to verify the preserved images.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-review
          path: |
            playwright-report
            test-results
  ios-foundation:
    # Preserve the original Swift references and their reviewed comparison contract.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -version
      - name: Verify native Swift package
        timeout-minutes: 20
        run: swift test --package-path apps/ios
        env:
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/artifacts/ios/snapshots
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (runtime for runtime in devices if ".iOS-" in runtime),
              key=lambda runtime: tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")),
              reverse=True,
          )
          phones = [d for runtime in runtimes for d in devices[runtime] if d["name"].startswith("iPhone")]
          if not phones: raise SystemExit("No available iOS iPhone simulator on the reference runner")
          phone = phones[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("id=" + phone["udid"] + "\n")
          '
      - name: Wait for the selected simulator to finish booting
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
      - run: xcodebuild test -project apps/ios/QelvoraApp.xcodeproj -scheme QelvoraApp -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -resultBundlePath artifacts/ios/FoundationFlow.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-review
          path: |
            artifacts/ios
            ${{ runner.temp }}/creator-native-${{ github.run_id }}-${{ github.job }}/NativeSnapshotTests
  android-foundation:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-review
          path: |
            apps/android/app/build/reports
            apps/android/app/build/paparazzi/failures
            apps/android/app/build/outputs/apk/debug/*.apk
  android-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify Android emulator
        run: |
          w3_sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          w3_install_log="${RUNNER_TEMP:?}/android-emulator-install.log"
          if ! "$w3_sdk_manager" --install emulator --channel=0 > "$w3_install_log" 2>&1; then
            cat "$w3_install_log"
            # Retry this observed SDK archive failure once; other failures stay fatal.
            if ! grep -Fq 'Error on ZipFile unknown archive' "$w3_install_log"; then
              exit 1
            fi
            "$w3_sdk_manager" --install emulator --channel=0
          else
            cat "$w3_install_log"
          fi
          "${ANDROID_HOME}/emulator/emulator" -version
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-runtime-review
          path: apps/android/app/build/reports/androidTests
