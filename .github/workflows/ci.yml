name: Foundation checks
on:
  # Pull request branches run once, as a pull request; a push runs only on main.
  push:
    branches: [main]
  pull_request:
  # The full matrix runs every night and on demand. 12:17 UTC is this repository's quietest CI hour,
  # and the odd minute avoids the rush of scheduled runs at the start of each hour.
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer run replaces an older one, except on main: a push there checks only what its own merge
  # changed, so a cancelled push run would leave that merge unchecked until the nightly run.
  group: foundation-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Decides which slow jobs a change needs. They skip only when a diff between two known commits
    # shows they can; anything this job can't classify runs them.
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.classify.outputs.native }}
      visual: ${{ steps.classify.outputs.visual }}
    steps:
      # Time limits sit on the steps: a step that times out fails `changes`, so every gated job runs.
      # A job-level limit would cancel `changes` instead, which gated jobs might read as a cancelled run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          # Every commit and tree, but file contents only for the root files and .github. Listing
          # changed paths needs nothing more.
          fetch-depth: 0
          sparse-checkout: .github
          persist-credentials: false
      - name: Classify the changed paths
        id: classify
        timeout-minutes: 5
        shell: bash
        env:
          QELVORA_EVENT: ${{ github.event_name }}
          QELVORA_PR_BASE: ${{ github.event.pull_request.base.sha }}
          QELVORA_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QELVORA_PUSH_BEFORE: ${{ github.event.before }}
          QELVORA_PUSH_AFTER: ${{ github.sha }}
        run: |
          native=true
          visual=true
          reason="a $QELVORA_EVENT run checks everything"
          case "$QELVORA_EVENT" in
            pull_request) base=$QELVORA_PR_BASE head=$QELVORA_PR_HEAD range="$QELVORA_PR_BASE...$QELVORA_PR_HEAD" ;;
            push) base=$QELVORA_PUSH_BEFORE head=$QELVORA_PUSH_AFTER range="$QELVORA_PUSH_BEFORE..$QELVORA_PUSH_AFTER" ;;
            *) range= ;;
          esac
          commit='^[0-9a-f]{40}$'
          zeros='^0+$'
          if [ -z "$range" ]; then
            :
          elif ! [[ $base =~ $commit && $head =~ $commit ]] || [[ $base =~ $zeros ]]; then
            reason="there is no base commit to compare with"
          # --no-renames lists both sides of a move, and -z keeps unusual names unquoted.
          elif ! git diff --name-only --no-renames -z "$range" > "$RUNNER_TEMP/changed-paths"; then
            reason="the changes in $range could not be listed"
          else
            native=false
            visual=false
            reason="compared $range"
            while IFS= read -r -d '' path; do
              case "$path" in
                # A change to the workflows, to local actions or to how Git checks files out runs the
                # full matrix, so the change itself is tested.
                .github/workflows/* | .github/actions/* | .gitattributes) native=true visual=true ;;
              esac
              case "$path" in
                # What the iOS and Android jobs build and test.
                apps/ios/* | apps/android/*) native=true ;;
                # The generators that write into both apps, and everything they read.
                scripts/generate-shared.mjs | scripts/generate-native-api.mjs) native=true ;;
                config/* | packages/api/generated/* | design/handoff/tokens.json) native=true ;;
                design/design-system/project/components/bundle.js) native=true ;;
              esac
              case "$path" in
                # The web app, its packages, the Playwright tests and the reference server.
                apps/web/* | packages/* | tests/visual/* | scripts/visual-* | playwright.config.ts) visual=true ;;
                # The design references and fonts the reference server reads, and the copy and brand
                # sources behind the generated packages.
                design/* | assets/* | config/*) visual=true ;;
                # The toolchain that installs and runs them. `pnpm install` reads every workspace
                # manifest and runs its install scripts.
                package.json | pnpm-lock.yaml | pnpm-workspace.yaml | turbo.json | tsconfig.base.json) visual=true ;;
                apps/*/package.json | .npmrc | .pnpmfile.cjs) visual=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "Native jobs run: $native. Visual job runs: $visual. Basis: $reason." | tee -a "$GITHUB_STEP_SUMMARY"
          # Written last, so a step that fails anywhere sets no outputs and every gated job runs.
          printf 'native=%s\nvisual=%s\n' "$native" "$visual" >> "$GITHUB_OUTPUT"
  evidence-budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check committed review evidence
        env:
          QELVORA_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
          QELVORA_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-evidence-budget.mjs --base "$QELVORA_EVIDENCE_BASE" --head "$QELVORA_EVIDENCE_HEAD"
  web-and-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: creator_foundation
          POSTGRES_PASSWORD: foundation-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CREATOR_TEST_DATABASE_URL: postgresql://postgres:foundation-test-only@127.0.0.1:5432/creator_foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The four gated jobs below skip when `changes` says they can. A job skipped by its `if:` reports
  # success to required checks. `!cancelled()` runs them even when `changes` itself fails.
  web-visual:
    # The preserved source baselines pass on macOS27/arm64; macOS26/Intel
    # now rasterizes two text-edge pixels differently. Keep exact comparisons.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.visual != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Record visual capture environment
        run: |
          sw_vers
          uname -m
          pnpm exec playwright --version
      - run: pnpm test:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-review
          path: |
            playwright-report
            test-results
  ios-foundation:
    # Preserve the original Swift references and their reviewed comparison contract.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -version
      - name: Verify native Swift package
        timeout-minutes: 20
        run: swift test --package-path apps/ios
        env:
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/artifacts/ios/snapshots
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (runtime for runtime in devices if ".iOS-" in runtime),
              key=lambda runtime: tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")),
              reverse=True,
          )
          phones = [d for runtime in runtimes for d in devices[runtime] if d["name"].startswith("iPhone")]
          if not phones: raise SystemExit("No available iOS iPhone simulator on the reference runner")
          # Prefer the reference phone on the newest runtime that has it. A newer runtime can offer only a
          # phone that xcodebuild cannot run once booted (iOS 27.1 offers only the iPhone Duo).
          phone = next((d for d in phones if d["name"] == "iPhone 18 Pro"), phones[0])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("id=" + phone["udid"] + "\n")
          '
      - name: Wait for the selected simulator to finish booting
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
      - run: xcodebuild test -project apps/ios/QelvoraApp.xcodeproj -scheme QelvoraApp -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -resultBundlePath artifacts/ios/FoundationFlow.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-review
          path: |
            artifacts/ios
            ${{ runner.temp }}/creator-native-${{ github.run_id }}-${{ github.job }}/NativeSnapshotTests
  android-foundation:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-review
          path: |
            apps/android/app/build/reports
            apps/android/app/build/paparazzi/failures
            apps/android/app/build/outputs/apk/debug/*.apk
  android-runtime:
    # Runs on Ubuntu, but builds and tests the Android app, so it is gated with the native jobs.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify Android runtime packages
        run: |
          w1_runtime_sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          w1_runtime_install_log="${RUNNER_TEMP:?}/android-runtime-install.log"
          w1_runtime_image="system-images;android-34;default;x86_64"
          if ! "$w1_runtime_sdk_manager" --install emulator "$w1_runtime_image" --channel=0 > "$w1_runtime_install_log" 2>&1; then
            cat "$w1_runtime_install_log"
            # Retry this observed SDK archive failure once; other failures stay fatal.
            if ! grep -Fq 'Error on ZipFile unknown archive' "$w1_runtime_install_log"; then
              exit 1
            fi
            "$w1_runtime_sdk_manager" --install emulator "$w1_runtime_image" --channel=0
          else
            cat "$w1_runtime_install_log"
          fi
          test -s "${ANDROID_HOME}/emulator/package.xml"
          test -s "${ANDROID_HOME}/system-images/android-34/default/x86_64/package.xml"
          "${ANDROID_HOME}/emulator/emulator" -no-window -noaudio -version
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-runtime-review
          path: apps/android/app/build/reports/androidTests
