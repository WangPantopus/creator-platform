name: QelvoraApp
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  QelvoraNative:
    path: .
targets:
  QelvoraApp:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CreatorAPIURL: $(CREATOR_API_URL)
        CreatorLinkHost: $(CREATOR_LINK_HOST)
        CreatorGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        CreatorGoogleServerClientID: $(GOOGLE_SERVER_CLIENT_ID)
        NSMicrophoneUsageDescription: Use your microphone for voice notes and calls you choose.
        NSCameraUsageDescription: Share your camera in a video call you choose to join.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: local-development-entry
            CFBundleURLSchemes: [qelvora]
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_IOS_CLIENT_ID)]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CREATOR_API_URL: ""
        CREATOR_LINK_HOST: ""
        GOOGLE_IOS_CLIENT_ID: ""
        GOOGLE_SERVER_CLIENT_ID: ""
        GOOGLE_REVERSED_IOS_CLIENT_ID: "qelvora-google-unconfigured"
        PRODUCT_BUNDLE_IDENTIFIER: com.pantopus.qelvora
        CODE_SIGN_ENTITLEMENTS: App/QelvoraApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Qelvora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: QelvoraNative
        product: QelvoraUI
  QelvoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantopus.qelvora.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: QelvoraApp
schemes:
  QelvoraApp:
    build:
      targets:
        QelvoraApp: all
        QelvoraUITests: [test]
    test:
      targets:
        - QelvoraUITests
